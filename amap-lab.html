<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>高德地图验证 · 岛屿漫游</title><link rel="stylesheet" href="amap-lab.css"></head>
<body><header><a href="./">← 岛屿漫游</a><span>高德地图验证</span></header>
<main><aside><h1>直接从地图找店</h1><p class="muted">放大地图，点击高德自带的店家；也可搜索地图中心附近的餐馆。</p>
<details id="setup" open><summary>连接高德</summary><form id="connect"><label>Web端（JS API）Key<input id="amap-key" autocomplete="off" required pattern="[a-fA-F0-9]{32}" placeholder="在高德控制台创建后填写"></label><label>安全密钥（securityJsCode）<input id="amap-security" type="password" autocomplete="off" required pattern="[a-fA-F0-9]{32}"></label><label class="check"><input id="world" type="checkbox">启用世界地图（需另有权限）</label><p class="muted small">仅用于本页测试，不保存密钥或店家数据。连接和搜索会消耗高德账号额度。正式接入前需改用服务端保护安全密钥。</p><button id="start" type="submit">连接并显示地图</button></form><a href="https://console.amap.com/dev/key/app" target="_blank" rel="noopener noreferrer">打开高德应用管理 ↗</a></details>
<div class="city-switch" aria-label="测试城市"><button data-city="taipei" disabled>台北</button><button data-city="tainan" disabled>台南</button></div>
<button id="nearby" disabled>找地图中心附近的餐馆</button><label class="check"><input id="auto" type="checkbox" disabled>移动地图后自动找餐馆</label><p class="small muted">搜索中心周边 1.2 公里，每次最多展示 25 个结果，并非区域内全部店家。</p>
<p id="status" role="status" aria-live="polite">等待填写 Key，尚未连接高德。</p><p id="usage" class="small muted">本页搜索／详情请求：0 次</p><section id="detail" aria-label="店家详情"><p class="muted">点击地图上的店名或搜索结果，查看高德实际返回的资料。</p></section><div id="results" aria-label="附近餐馆"></div>
</aside><section class="map-wrap" aria-label="高德地图"><div id="amap"><div class="empty"><strong>等待连接</strong><p>连接后，地图与店家均由高德提供。</p></div></div></section></main><script src="amap-lab.js"></script></body></html>
