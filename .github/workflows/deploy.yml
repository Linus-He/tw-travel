name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static website
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_MAPS_MAP_ID: ${{ vars.GOOGLE_MAPS_MAP_ID }}
        run: |
          mkdir public
          cp index.html style.css app.js map.js public/
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          config = {
              'googleMapsApiKey': os.environ.get('GOOGLE_MAPS_API_KEY', ''),
              'googleMapsMapId': os.environ.get('GOOGLE_MAPS_MAP_ID', ''),
          }
          Path('public/config.js').write_text('window.TRAVEL_CONFIG = ' + json.dumps(config) + ';\n')
          PYTHON
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
