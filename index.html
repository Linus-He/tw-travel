<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>岛屿漫游 · 台湾旅行地图</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="./"><span>◈</span> 岛屿漫游 <small>TAIWAN, AT YOUR PACE</small></a><nav><button class="active" id="explore">探索地图</button><button id="saved">我的收藏</button><button id="write">＋ 编写攻略</button></nav></header><main><aside><div class="eyebrow">A LITTLE ISLAND. ENDLESS DISCOVERIES.</div><h1>下一站，<br>遇见台湾<span>。</span></h1><p class="intro">沿着街巷的香气，收藏属于你的岛屿日常。</p><label class="search">⌕ <input id="search" placeholder="搜索店名、城市或美食…" aria-label="搜索地点"></label><div class="filters" id="filters"></div><div class="list-heading"><h2 id="listTitle">值得绕路的地方</h2><span id="count"></span></div><div id="list"></div><footer>发现灵感，也留下你的故事。<br><span>当前为演示地点 · 评分非平台实时数据</span><button id="export">导出我的旅行笔记 ↗</button><label class="import">导入笔记 <input type="file" id="import" accept="application/json"></label></footer></aside><section class="map-wrap"><div id="map"></div><div class="map-label"><span class="live"></span> <span id="map-status" role="status">正在加载地图…</span> <small>滚轮放大 · 点击地点查看详情</small></div><div class="map-note">山海之间，都是好去处。<span>EXPLORE FORMOSA</span></div></section></main><dialog id="detail"><button class="close" aria-label="关闭">×</button><div id="detailContent"></div></dialog><dialog id="editor"><button class="close" aria-label="关闭">×</button><div class="eyebrow">YOUR ISLAND JOURNAL</div><h2>写下你的岛屿记忆</h2><form id="guideForm"><label>地点 / 攻略标题<input name="title" required maxlength="100" placeholder="例如：台南老街的一日散步"></label><label>城市<input name="city" required placeholder="台南"></label><label>旅行笔记<textarea name="body" required rows="6" placeholder="路线、美食、花费，或值得记住的小事…"></textarea></label><label>来源链接（可选）<input name="url" type="url" placeholder="https://…"></label><button class="primary">保存到我的笔记</button></form><div id="guides"></div></dialog><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="config.js"></script><script src="map.js"></script><script src="app.js"></script></body></html>
